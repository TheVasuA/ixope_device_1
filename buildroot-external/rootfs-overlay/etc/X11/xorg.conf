Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "AutoEnableDevices" "true"
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen "Screen0"
    InputDevice "Touch" "CorePointer"
EndSection

Section "InputDevice"
    Identifier "Touch"
    Driver "evdev"
    Option "Device" "/dev/input/event3"
    Option "Emulate3Buttons" "true"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Device0"
EndSection

Section "Device"
    Identifier "Device0"
    Driver "modesetting"
EndSection
